name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # CI must never regenerate the what-if golden files (that would make every comparison pass trivially). Set to empty here, and the first step
  # below plus WhatIfGoldenTests.CiRun_MustNotRequestAGoldenUpdate fail the job when it is set anyway. Regenerate locally with tools/Update-WhatIfGoldens.ps1.
  EARM_UPDATE_GOLDENS: ""

# Action pinning: every action below is pinned to a MAJOR tag (@v4). A tag is movable, so a compromised or retagged action release would run here with this
# job's token (read-only: see `permissions`) and the source tree. Pinning to a full commit SHA closes that gap and is the stricter choice, at the price of
# a manual (or Dependabot-driven) bump for every release. SHAs are deliberately NOT written here: they cannot be verified from this repository, and an
# invented SHA is worse than a tag. To tighten: replace each `@v4` with `@<40-hex commit SHA> # v4.x.y` and enable Dependabot for github-actions.
jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # global.json pins the SDK (10.0.301) and rolls forward to a later 10.0.x feature band.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Refuse a golden-file update on CI
        shell: pwsh
        run: |
          if ($env:CI -eq 'true' -and -not [string]::IsNullOrEmpty($env:EARM_UPDATE_GOLDENS)) {
            throw "EARM_UPDATE_GOLDENS is set on a CI run: golden files must never be regenerated by CI."
          }

      - name: Build (zero warnings)
        shell: pwsh
        run: pwsh -File build.ps1

      # EArm.Integration.Tests is gated by EARM_IT_TENANT, which CI never sets: it needs a real dev tenant.
      # The Linux job is what runs the Unix-only tests (owner-only file modes 0600, symbolic-link refusal); the Windows job runs the DACL tests. Each
      # platform's tests skip on the other with a stated reason, so a green matrix means both halves ran.
      # test.ps1 runs the Category=Timing tests (wall-clock bounds) serially after the parallel pass.
      - name: Test
        shell: pwsh
        run: pwsh -File test.ps1

      # Release configuration: the shipped build must compile warning-free too (Directory.Build.props treats warnings as errors).
      - name: Build (Release, zero warnings)
        shell: pwsh
        run: pwsh -File build.ps1 -Configuration Release

      # The tool package, as an artifact only: nothing is published from CI. ContinuousIntegrationBuild + DeterministicSourcePaths keep absolute build
      # paths out of the package (the same switches deploy.ps1 passes).
      - name: Pack the tool (artifact only)
        shell: pwsh
        run: dotnet pack src/EArm.Cli/EArm.Cli.csproj --configuration Release --output artifacts/nupkg -p:ContinuousIntegrationBuild=true -p:DeterministicSourcePaths=true

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the tool package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: earm-nupkg
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 14
